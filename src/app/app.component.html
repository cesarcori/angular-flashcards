<!-- Top Navigation Toolbar -->
<mat-toolbar color="primary" class="app-toolbar">
    <span>Flashcards with Angular 13</span>
</mat-toolbar>

<!-- Main Container -->


<main class="container">
    <!-- Category Chips -->
    <mat-chip-list aria-label="Select category" class="category-chips">
        <mat-chip *ngFor="let category of categories" [selected]="category === selectedCategory"
            (click)="selectCategory(category)" color="accent">
            {{ category }}
        </mat-chip>
    </mat-chip-list>

    <app-flashcard [card]="currentCard!"></app-flashcard>

    <button mat-fab color="primary" matTooltip="Next Card" (click)="nextCard()">
        <mat-icon>arrow_forward</mat-icon>
    </button>
</main>
