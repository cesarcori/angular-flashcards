<!-- Top Navigation Toolbar -->
<mat-toolbar color="primary" class="app-toolbar">
    <span>Flashcards with Angular 13</span>
</mat-toolbar>

<!-- Main Container -->


<main class="container">
    <mat-radio-group aria-label="Select an option">
        <mat-radio-button *ngFor="let category of categories" [value]="category"
            [checked]="category === selectedCategory" (change)="selectCategory(category)">
            {{ category }}
        </mat-radio-button>
    </mat-radio-group>
    <app-flashcard [card]="currentCard!"></app-flashcard>

    <button mat-fab color="primary" matTooltip="Next Card" (click)="nextCard()">
        <mat-icon>arrow_forward</mat-icon>
    </button>
</main>
