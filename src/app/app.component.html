<!-- Top Navigation Toolbar -->
<mat-toolbar color="primary" class="app-toolbar">
    <span>Flashcards with Angular 13</span>
</mat-toolbar>

<!-- Main Container -->
<main class="container">
    <mat-card class="flashcard">

        <!-- Category Badge -->
        <mat-card-subtitle>
            <mat-chip-list>
                <mat-chip color="accent" selected>Geography</mat-chip>
            </mat-chip-list>
        </mat-card-subtitle>

        <!-- Flashcard Question -->
        <mat-card-content class="card-content">
            <h2 class="question-text">What is the capital of France?</h2>
        </mat-card-content>

        <!-- Action Button -->
        <mat-card-actions align="end">
            <button mat-raised-button color="primary">Show Answer</button>
        </mat-card-actions>

    </mat-card>
</main>
